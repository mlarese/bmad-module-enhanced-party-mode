code: epm
name: "Enhanced Party Mode"
description: "Consiglio di esperti craft/legal/infra/WP/fiscale per party mode e cantiere — Vesper, Vera, Jane, Elena, Rex, Niki, Dan Arrow."
module_version: 1.21.0
default_selected: false
module_greeting: >
  Enhanced Party Mode (epm) è pronto.
  Gli agenti del consiglio sono registrati in bmad-help e nel roster di party mode.
  Riesegui epm-setup in qualsiasi momento per riconfigurare, oppure aggiorna _bmad/config.yaml / config.user.yaml.

  Agenti: Vesper · Vera Motion · Jane Privacy · Elena Giuridis · Rex Wire · Niki Press · Dan Arrow.

agents:
  - code: agent-frontend-taste
    name: Vesper
    title: Direttore Craft Frontend
    icon: "✦"
    description: "Vesper — craft FE: locale+activity Envato; marketing|dashboard|mobile; hero_copy seed; sezioni auto; Envato ≥30; responsive; output apps/<slug>/; Vera repeat. Mai banale."
  - code: agent-gdpr-counsel
    name: Jane Privacy
    title: Consigliere GDPR
    icon: "🛡️"
    description: "Jane Privacy — esperto GDPR Italia/UE: RoPA, DPIA, breach, transfer, cookie/ePrivacy e privacy-by-design; specializzazione sotto Elena."
  - code: agent-it-infra-expert
    name: Rex Wire
    title: Esperto IT Infra
    icon: "🔌"
    description: "Rex Wire — sysadmin/SRE: cloud multi-provider, SSH/tunneling, architetture di rete, Docker, hardening pratico."
  - code: agent-tech-law-counsel
    name: Elena Giuridis
    title: Consulente Legale Tech
    icon: "⚖️"
    description: "Consulenza legale precisa su software, AI, AI Act e tech regulation, con fonti e limiti dichiarati."
  - code: agent-web-animations
    name: Vera Motion
    title: Craftsperson Web Animations
    icon: "✨"
    description: "Vera Motion — craftsperson del movimento web: apply motion, catalogo, demo, reverse engineer, audit perf/a11y."
  - code: agent-wordpress-expert
    name: Niki Press
    title: Esperto WordPress
    icon: "📰"
    description: "Niki Press — craftsperson WordPress: diagnosi, theme/block, plugin, WooCommerce, performance, sicurezza e migrazioni lean."
  - code: agent-world-cpa
    name: Dan Arrow
    title: Commercialista Mondiale
    icon: "🧾"
    description: "Counsel fiscale/contabile IT-hub + UE/mondo, anti-invenzione; memoria e Pulse scadenze. Non per bookkeeping generico, GDPR o tech-law."

# Nessuna variabile da chiedere. Ce n'erano due — dove salvare le demo e dove
# tenere la memoria — e nessuna skill le leggeva: verificato, zero riferimenti
# fuori da epm-setup. I fatti le contraddicevano pure: Vesper scrive in
# `apps/<slug>/` per legge del suo skill, e i sanctum vivono in
# `_bmad/memory/agent-<nome>/`, non in `_bmad/memory/epm/`. Chiedere all'utente
# una decisione che poi nessuno usa e' peggio che non chiedergliela: gli fa
# credere di avere una scelta.

directories:
  - "_bmad/memory"

post-install-notes: >
  ESEGUI ORA epm-setup. L'installer ha copiato le skill, ma non registra il modulo
  nel sistema di aiuto: finché non lo lanci, bmad-help non conosce gli agenti del
  consiglio. epm-setup consolida _bmad/config.yaml e _bmad/module-help.csv, e
  conserva le risposte che hai già dato.

  Poi: attiva bmad-party-mode (gruppo super-esperti se configurato) oppure chiama
  direttamente Vesper, Vera, Jane, Elena, Rex, Niki o Dan Arrow.

  Per aggiornare basta npx bmad-method install --action quick-update: aggiorna i
  file anche di questo modulo. Ma NON riscrive epm.version in _bmad/config.yaml —
  quel campo lo scrive solo epm-setup — quindi dopo l aggiornamento rilancia
  epm-setup, o la config resta indietro e sembra che non sia successo niente.

  Se invece reinstalli, ELENCA epm fra i moduli: una reinstallazione che non lo
  elenca lo cancella.
